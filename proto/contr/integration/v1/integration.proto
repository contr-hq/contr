syntax = "proto3";

package contr.integration.v1;

option csharp_namespace = "Contr.Sdk.Integration.V1";

// Integration of the engine with the user's own tools.
service IntegrationService {
  // Reports the Docker CLI tools this daemon bundles and the ones installed for the calling user.
  rpc GetCliTools(GetCliToolsRequest) returns (GetCliToolsResponse);
  // Installs the bundled Docker CLI tools for the calling user and adds them to the user's PATH; fails with
  // FEATURE_UNAVAILABLE where the daemon bundles none.
  rpc InstallCliTools(InstallCliToolsRequest) returns (InstallCliToolsResponse);
  // Lists the calling user's WSL distributions, without Contr's own, and their access to the engine; fails with
  // FEATURE_UNAVAILABLE where the engine does not run in WSL.
  rpc ListWslDistributions(ListWslDistributionsRequest) returns (ListWslDistributionsResponse);
  // Turns engine access from one WSL distribution on or off and keeps the choice across restarts; fails with
  // FEATURE_UNAVAILABLE where the engine does not run in WSL, NOT_FOUND for a distribution that is not registered,
  // and FAILED_PRECONDITION for a WSL 1 distribution.
  rpc SetWslIntegration(SetWslIntegrationRequest) returns (SetWslIntegrationResponse);
}

message GetCliToolsRequest {}

message GetCliToolsResponse {
  CliTools cli_tools = 1;
}

message InstallCliToolsRequest {}

message InstallCliToolsResponse {
  CliTools cli_tools = 1;
}

// Docker CLI tools for the calling user.
message CliTools {
  repeated CliTool tools = 1;
  // Directory that holds the installed `docker` executable.
  string bin_dir = 2;
  // A new shell resolves `docker` to the installed executable.
  bool on_path = 3;
  // Another `docker` executable a new shell resolves first; empty when none.
  string shadowed_by = 4;
}

message CliTool {
  // Such as "docker", "compose", "buildx", "credential-wincred" or "kubectl".
  string name = 1;
  // Version this daemon bundles; empty when it bundles none.
  string bundled_version = 2;
  // Version installed for the user; empty when not installed.
  string installed_version = 3;
}

message ListWslDistributionsRequest {}

message ListWslDistributionsResponse {
  repeated WslDistribution distributions = 1;
}

message SetWslIntegrationRequest {
  string name = 1;
  bool enabled = 2;
}

message SetWslIntegrationResponse {
  WslDistribution distribution = 1;
}

// One of the user's WSL distributions.
message WslDistribution {
  string name = 1;
  // 1 or 2; only version 2 distributions can reach the engine.
  uint32 wsl_version = 2;
  // `wsl.exe` starts this distribution when none is named.
  bool is_default = 3;
  WslIntegrationState integration_state = 4;
  // Why the last attempt failed; empty unless the state is FAILED.
  string failure = 5;
}

enum WslIntegrationState {
  WSL_INTEGRATION_STATE_UNSPECIFIED = 0;
  // Engine access is off.
  WSL_INTEGRATION_STATE_DISABLED = 1;
  // Engine access is on and waits for the engine to run or for the distribution to start serving it.
  WSL_INTEGRATION_STATE_PENDING = 2;
  // `docker` in the distribution reaches the engine.
  WSL_INTEGRATION_STATE_ACTIVE = 3;
  // Engine access is on, but the last attempt failed; Contr retries.
  WSL_INTEGRATION_STATE_FAILED = 4;
}
