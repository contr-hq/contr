syntax = "proto3";

package contr.engine.v1;

import "contr/common/v1/errors.proto";
import "contr/common/v1/progress.proto";

option csharp_namespace = "Contr.Sdk.Engine.V1";

// Lifecycle of the container engine the daemon manages.
service EngineService {
  // Streams engine state changes, starting with the current state.
  rpc WatchState(WatchStateRequest) returns (stream WatchStateResponse);
  // Provisions the engine when needed and starts it; cancelling the call does not cancel the operation.
  rpc Start(StartRequest) returns (stream StartResponse);
  // Stops the engine and its containers; cancelling the call does not cancel the operation.
  rpc Stop(StopRequest) returns (stream StopResponse);
  // Stops and starts the engine; cancelling the call does not cancel the operation.
  rpc Restart(RestartRequest) returns (stream RestartResponse);
  // Stops the engine, then restores it to a clean state; fails with FEATURE_UNAVAILABLE, before stopping anything,
  // where the daemon does not own the engine. Cancelling the call does not cancel the operation.
  rpc Reset(ResetRequest) returns (stream ResetResponse);
  // Streams the engine's resource usage about every two seconds; ends with ENGINE_NOT_RUNNING when the engine stops.
  rpc StreamUsage(StreamUsageRequest) returns (stream StreamUsageResponse);
}

message WatchStateRequest {}

message WatchStateResponse {
  EngineState state = 1;
  // Set only when state is ENGINE_STATE_FAILED.
  contr.common.v1.ErrorReason failure_reason = 2;
}

enum EngineState {
  ENGINE_STATE_UNSPECIFIED = 0;
  ENGINE_STATE_UNINITIALIZED = 1;
  ENGINE_STATE_PROVISIONING = 2;
  ENGINE_STATE_STOPPED = 3;
  ENGINE_STATE_STARTING = 4;
  ENGINE_STATE_RUNNING = 5;
  ENGINE_STATE_STOPPING = 6;
  ENGINE_STATE_UPDATING = 7;
  ENGINE_STATE_RESETTING = 8;
  ENGINE_STATE_FAILED = 9;
}

message StartRequest {}

message StartResponse {
  oneof event {
    contr.common.v1.Progress progress = 1;
    // Last message of the stream.
    EngineState state = 2;
  }
}

message StopRequest {}

message StopResponse {
  oneof event {
    contr.common.v1.Progress progress = 1;
    // Last message of the stream.
    EngineState state = 2;
  }
}

message RestartRequest {}

message RestartResponse {
  oneof event {
    contr.common.v1.Progress progress = 1;
    // Last message of the stream.
    EngineState state = 2;
  }
}

message ResetRequest {
  ResetScope scope = 1;
}

enum ResetScope {
  RESET_SCOPE_UNSPECIFIED = 0;
  // Replaces the engine's runtime and keeps images, containers and volumes; the engine ends STOPPED.
  RESET_SCOPE_RUNTIME = 1;
  // Deletes every image, container, volume and the build cache; the engine ends UNINITIALIZED.
  RESET_SCOPE_FACTORY = 2;
}

message ResetResponse {
  oneof event {
    contr.common.v1.Progress progress = 1;
    // Last message of the stream.
    EngineState state = 2;
  }
}

message StreamUsageRequest {}

message StreamUsageResponse {
  EngineUsage usage = 1;
}

// Resources the engine uses: the CPU and memory of its running containers, and the disk its data takes. The first
// sample of a stream can report zero CPU and memory while container stats start.
message EngineUsage {
  // 100.0 per fully used CPU, summed over running containers.
  double cpu_percent = 1;
  // CPUs of the machine the engine runs on; on Windows, the WSL virtual machine.
  uint32 cpus = 2;
  // Summed over running containers and counted as `docker stats` counts it.
  uint64 memory_used_bytes = 3;
  // Memory of the machine the engine runs on; on Windows, the WSL virtual machine.
  uint64 memory_total_bytes = 4;
  // Images, containers, volumes and build cache; refreshed about once a minute, zero until first measured.
  uint64 disk_used_bytes = 5;
  uint32 running_containers = 6;
}
