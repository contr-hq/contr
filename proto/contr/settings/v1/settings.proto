syntax = "proto3";

package contr.settings.v1;

import "google/protobuf/field_mask.proto";

option csharp_namespace = "Contr.Sdk.Settings.V1";

// The daemon's settings for the calling user: defaults, overridden by the user's own values, overridden in turn by
// values an administrator fixes.
service SettingsService {
  // Returns the effective settings and which of them an administrator fixes.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // Streams the effective settings, starting with the current ones and again after every change.
  rpc WatchSettings(WatchSettingsRequest) returns (stream WatchSettingsResponse);
  // Changes the fields update_mask names; fails with FAILED_PRECONDITION and SETTING_LOCKED when an administrator
  // fixes one of them, with ABORTED when etag is set and stale, and with INVALID_ARGUMENT for an unknown path.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // Returns every setting the user changed to its default; settings an administrator fixes keep that value.
  rpc ResetSettings(ResetSettingsRequest) returns (ResetSettingsResponse);
}

message Settings {
  EngineSettings engine = 1;
  ProxySettings proxy = 2;
  CertificateSettings certificates = 3;
  RegistrySettings registry = 4;
}

message EngineSettings {
  // Starts the engine whenever the daemon starts.
  bool start_with_daemon = 1;
  // Windows: also serves the engine on \\.\pipe\docker_engine when no other program does, so tools that ignore Docker
  // contexts reach it. Takes effect at the next engine start.
  bool serve_default_pipe = 2;
  // The engine's daemon.json as a JSON object; "{}" holds no settings. Contr sets hosts, data-root, host-gateway-ip,
  // host-gateway-ips, proxies and registry-mirrors itself, so UpdateSettings refuses them, and also refuses what the
  // engine rejects when it can ask the engine, with a DaemonJsonRejection detail. Applies only where DaemonService.GetInfo reports
  // CAPABILITY_ENGINE_CONFIGURATION, from the next engine start.
  string daemon_json = 3;
}

// How the engine reaches servers outside the machine, for pulls, pushes and builds. Applies only where
// DaemonService.GetInfo reports CAPABILITY_ENGINE_CONFIGURATION, from the next engine start.
message ProxySettings {
  ProxyMode mode = 1;
  // Manual mode: proxy for http:// destinations, such as "http://proxy.example.com:3128"; a server without a scheme
  // speaks HTTP.
  string http = 2;
  // Manual mode: proxy for https:// destinations.
  string https = 3;
  // Manual mode: destinations reached directly, as a NO_PROXY list such as ".corp.example.com,10.0.0.0/8".
  string exclude = 4;
  // New containers and builds also receive the engine's proxy as HTTP_PROXY, HTTPS_PROXY and NO_PROXY, in upper and
  // lower case, unless they set the variable themselves.
  bool pass_to_containers = 5;
}

enum ProxyMode {
  PROXY_MODE_UNSPECIFIED = 0;
  // Windows' proxy settings, including a configuration script or automatic detection; when they name no proxy, and
  // on Linux, HTTP_PROXY, HTTPS_PROXY and NO_PROXY.
  PROXY_MODE_SYSTEM = 1;
  // The servers in ProxySettings.
  PROXY_MODE_MANUAL = 2;
  // Direct connections.
  PROXY_MODE_NONE = 3;
}

// Certificates the engine trusts. Applies only where DaemonService.GetInfo reports CAPABILITY_ENGINE_CONFIGURATION,
// from the next engine start.
message CertificateSettings {
  // The engine also trusts the root certificates the operating system trusts, including those an organization deploys
  // to inspect HTTPS traffic.
  bool trust_system = 1;
}

// Registries the engine uses. Applies only where DaemonService.GetInfo reports CAPABILITY_ENGINE_CONFIGURATION, from
// the next engine start.
message RegistrySettings {
  // Docker Hub mirrors the engine tries before Docker Hub, as http:// or https:// URLs.
  repeated string mirrors = 1;
}

// Detail of the INVALID_ARGUMENT status UpdateSettings returns when the engine rejects engine.daemon_json.
message DaemonJsonRejection {
  // Top-level keys the engine does not know, sorted.
  repeated UnknownDaemonKey unknown_keys = 1;
}

// A top-level daemon.json key the engine does not know.
message UnknownDaemonKey {
  string key = 1;
  // A key the engine accepts with the same value, such as "log-opts" for "log-opt"; empty when no known key is close.
  string suggestion = 2;
}

// Effective settings at one point in time.
message SettingsState {
  Settings settings = 1;
  // Field paths an administrator fixes, such as "engine.start_with_daemon"; clients show them as read-only.
  repeated string locked_paths = 2;
  // Changes with every change to the settings; UpdateSettings compares it to detect a concurrent edit.
  string etag = 3;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  SettingsState state = 1;
}

message WatchSettingsRequest {}

message WatchSettingsResponse {
  SettingsState state = 1;
}

message UpdateSettingsRequest {
  // Values for the paths update_mask names; other fields are ignored.
  Settings settings = 1;
  google.protobuf.FieldMask update_mask = 2;
  // The etag the client last saw; empty skips the check.
  string etag = 3;
}

message UpdateSettingsResponse {
  SettingsState state = 1;
  // Changed paths that take effect only at the next engine start while the engine runs.
  repeated string restart_required = 2;
}

message ResetSettingsRequest {}

message ResetSettingsResponse {
  SettingsState state = 1;
  repeated string restart_required = 2;
}
