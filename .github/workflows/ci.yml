name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: contr-hq/.github/.github/workflows/rust-ci.yml@main
    with:
      runners: '["ubuntu-latest", "windows-latest"]'

  comments:
    uses: contr-hq/.github/.github/workflows/comment-lint.yml@main

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask codegen
      - name: Generated code matches proto/
        run: git diff --exit-code -- crates/contr-api/src/gen

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          breaking: ${{ github.event_name == 'pull_request' }}
          push: false
          archive: false
          pr_comment: false

  sdk-csharp:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: cargo build --package contr-daemon --package contr-sdkgen
      - run: target/debug/contr-sdkgen generate --lang csharp --out target/sdk/csharp
      - run: target/debug/contr-sdkgen verify --lang csharp --sdk target/sdk/csharp --daemon target/debug/contrd
      - run: dotnet build target/sdk/csharp/samples/ListContainers --configuration Release

  guest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask guest
      - name: Images are importable by WSL
        run: |
          for image in target/guest/contr-runtime-amd64.tar target/guest/contr-data-amd64.tar; do
            tar -tf "$image" | grep -qx 'etc/wsl.conf'
            tar -tf "$image" | grep -qx 'usr/local/bin/contr-agent'
            ! tar -tf "$image" | grep -qx 'etc/resolv.conf'
          done
          tar -tf target/guest/contr-runtime-amd64.tar | grep -qx 'usr/local/bin/dockerd'
      - run: cargo xtask windows-cli
      - name: Windows CLI bundle is complete
        run: |
          for file in bin/docker.exe bin/docker-credential-wincred.exe cli-plugins/docker-compose.exe \
            cli-plugins/docker-buildx.exe cli.json; do
            test -s "target/windows-cli/$file"
          done
          jq -e '.docker and .compose and .buildx and ."credential-wincred"' target/windows-cli/cli.json

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck tools/windows-sandbox/sandbox
      - name: XML templates are well-formed
        run: python3 -c 'import sys, xml.etree.ElementTree as et; [et.parse(f) for f in sys.argv[1:]]' tools/windows-sandbox/*.xml.in
      - run: python3 -m py_compile tools/windows-sandbox/ppm2png.py
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
              Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $findings = Invoke-ScriptAnalyzer -Path tools/windows-sandbox/guest -Recurse `
              -Settings tools/windows-sandbox/PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize -Wrap RuleName, ScriptName, Line, Message
          if ($findings) { exit 1 }

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
