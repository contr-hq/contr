name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - .cargo/config.toml
      - .github/workflows/release.yml
      - guest/**
      - packaging/**
      - xtask/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-assets:
    # The Linux binaries need the glibc of the runner they are built on, which packaging/linux/nfpm.yaml depends on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask guest
      - run: cargo xtask guest-sources
      - name: Pack the guest sources, keeping their links and modes
        run: tar -czf target/contr-guest-sources.tar.gz -C target/guest-sources contr-guest-sources
      - run: cargo xtask windows-cli
      - name: Version a tag's binaries by the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "CONTR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --package contr-daemon --package contr-cli --package contr-helper
      - uses: actions/upload-artifact@v7
        with:
          name: linux-assets
          path: |
            target/guest
            target/windows-cli
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: guest-sources
          path: target/contr-guest-sources.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: |
            target/release/contrd
            target/release/contr
            target/release/contr-helper
          if-no-files-found: error

  windows-binaries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Version a tag's binaries by the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "CONTR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --package contr-daemon --package contr-cli
      - name: The binaries need no Visual C++ Redistributable
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio", "${env:ProgramFiles(x86)}\Microsoft Visual Studio" `
              -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
              Where-Object FullName -like '*Hostx64*x64*' | Select-Object -First 1 -ExpandProperty FullName
          foreach ($exe in 'contrd.exe', 'contr.exe') {
              $imports = & $dumpbin /nologo /dependents "target/release/$exe" | Out-String
              if ($imports -match '(?i)vcruntime|msvcp') { throw "$exe imports the Visual C++ runtime" }
          }
      - name: The binaries name the product and the build's version
        shell: pwsh
        run: |
          foreach ($exe in 'contrd.exe', 'contr.exe') {
              $info = (Get-Item "target/release/$exe").VersionInfo
              if ($info.ProductName -ne 'Contr') { throw "$exe names the product '$($info.ProductName)'" }
              if (-not $info.ProductVersion) { throw "$exe carries no product version" }
              if ($env:CONTR_VERSION -and $info.ProductVersion -ne $env:CONTR_VERSION) {
                  throw "$exe carries version $($info.ProductVersion), not $env:CONTR_VERSION"
              }
          }
      # A tag's binaries are signed once the organization holds the Artifact Signing settings; docs/releasing.md.
      - name: Sign the binaries
        if: startsWith(github.ref, 'refs/tags/v') && vars.ARTIFACT_SIGNING_ENDPOINT != ''
        uses: Azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\contrd.exe
            ${{ github.workspace }}\target\release\contr.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: The signatures are valid
        if: startsWith(github.ref, 'refs/tags/v') && vars.ARTIFACT_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          foreach ($exe in 'contrd.exe', 'contr.exe') {
              $signature = Get-AuthenticodeSignature "target/release/$exe"
              if ($signature.Status -ne 'Valid') { throw "$exe is not validly signed: $($signature.StatusMessage)" }
          }
      - name: A tag without signing settings ships unsigned binaries
        if: startsWith(github.ref, 'refs/tags/v') && vars.ARTIFACT_SIGNING_ENDPOINT == ''
        run: echo "::warning::contrd.exe and contr.exe are unsigned; docs/releasing.md lists the signing settings."
      - uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: |
            target/release/contrd.exe
            target/release/contr.exe
          if-no-files-found: error

  payload:
    needs: [linux-assets, windows-binaries]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      PACKAGES_DISPATCH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: linux-assets
          path: target
      - uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: target/windows-binaries
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: target/linux-binaries
      - uses: actions/download-artifact@v8
        with:
          name: guest-sources
          path: target/dist
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: >-
          mkdir -p target/notices && cargo about generate --config packaging/licenses/about.toml
          --output-file target/notices/rust-crates.txt packaging/licenses/about.hbs
      - run: cargo xtask dist-windows --binaries target/windows-binaries
      - run: chmod +x target/linux-binaries/* && cargo xtask dist-linux --binaries target/linux-binaries
      - name: Debian and RPM packages
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "xtask") | .version')
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version=${GITHUB_REF_NAME#v}
          cargo xtask package-linux --version "$version"
      - name: Archive
        run: |
          label=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "$GITHUB_REF_NAME" || git rev-parse --short=12 HEAD)
          cd target/dist
          zip -qr "contr-core-windows-x64-$label.zip" contr-core-windows-x64
          tar -czf "contr-linux-x64-$label.tar.gz" contr-linux-x64
          mv contr-guest-sources.tar.gz "contr-guest-sources-$label.tar.gz"
          # GitHub renames release assets whose names hold characters such as ~, which SHA256SUMS would then not match.
          for package in contr-daemon*.deb contr-daemon*.rpm; do
            if [[ "$package" == *'~'* ]]; then mv "$package" "${package//'~'/-}"; fi
          done
          sha256sum contr-core-windows-x64-*.zip contr-linux-x64-*.tar.gz contr-daemon_*.deb contr-daemon-*.rpm \
            contr-guest-sources-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            target/dist/contr-core-windows-x64-*.zip
            target/dist/contr-linux-x64-*.tar.gz
            target/dist/contr-daemon_*.deb
            target/dist/contr-daemon-*.rpm
            target/dist/contr-guest-sources-*.tar.gz
            target/dist/SHA256SUMS
          if-no-files-found: error
      - name: Attest where the release files were built
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/dist/contr-core-windows-x64-*.zip
            target/dist/contr-linux-x64-*.tar.gz
            target/dist/contr-daemon_*.deb
            target/dist/contr-daemon-*.rpm
            target/dist/contr-guest-sources-*.tar.gz
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "::error::$notes holds no release notes"; exit 1; }
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Contr ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes" $prerelease \
            target/dist/contr-core-windows-x64-*.zip target/dist/contr-linux-x64-*.tar.gz \
            target/dist/contr-daemon_*.deb target/dist/contr-daemon-*.rpm \
            target/dist/contr-guest-sources-*.tar.gz target/dist/SHA256SUMS
      - name: Have the package repositories pick up the release
        if: startsWith(github.ref, 'refs/tags/v') && env.PACKAGES_DISPATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.PACKAGES_DISPATCH_TOKEN }}
        run: gh api repos/contr-hq/contr-packages/dispatches -f event_type=release
