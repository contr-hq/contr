[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/contr-hq/contr"
publish = false

[workspace.dependencies]
contr-api = { path = "crates/contr-api" }
contr-backend = { path = "crates/contr-backend" }
contr-backend-host = { path = "crates/contr-backend-host" }
contr-backend-wsl = { path = "crates/contr-backend-wsl" }
contr-compose = { path = "crates/contr-compose" }
contr-core = { path = "crates/contr-core" }
contr-diagnostics = { path = "crates/contr-diagnostics" }
contr-daemon = { path = "crates/contr-daemon" }
contr-engine = { path = "crates/contr-engine" }
contr-engine-proxy = { path = "crates/contr-engine-proxy" }
contr-kube = { path = "crates/contr-kube" }
contr-mux = { path = "crates/contr-mux" }
contr-platform = { path = "crates/contr-platform" }
contr-sdk = { path = "crates/contr-sdk" }
contr-sdkgen = { path = "crates/contr-sdkgen" }
contr-settings = { path = "crates/contr-settings" }
contr-testkit = { path = "crates/contr-testkit" }
contr-transport = { path = "crates/contr-transport" }
contr-updater = { path = "crates/contr-updater" }

anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.92"
base64 = "0.22.1"
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["windows"] }
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
listenfd = "1.0.2"
nix = { version = "0.31.3", default-features = false, features = ["user"] }
prost = "0.14.4"
prost-types = "0.14.4"
protox = "0.10.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
sd-notify = "0.5.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.0"
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-util = "0.7.20"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tonic-types = "0.14.6"
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
windows-sys = "0.61.2"
winresource = { version = "0.1.34", default-features = false }
winreg = "0.56.0"
yaml-rust2 = "0.13.0"
yamux = "0.14.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
