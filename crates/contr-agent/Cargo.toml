[package]
name = "contr-agent"
description = "Guest agent that supervises the engine inside the Contr WSL distribution or virtual machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "contr-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
contr-core.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
contr-mux.workspace = true
nix = { workspace = true, features = ["mount", "net", "signal"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }

[lints]
workspace = true
