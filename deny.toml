[graph]
all-features = true
# Platforms Contr builds for; dependencies of other targets, such as wasm32, never ship.
targets = [
  "aarch64-apple-darwin",
  "aarch64-pc-windows-msvc",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
  { id = "RUSTSEC-2026-0370", reason = "zbus 5 depends on zvariant; zbus 6 absorbed it, and the Linux client's tray (ksni) pins zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus 5 depends on zbus_names; zbus 6 absorbed it, and the Linux client's tray (ksni) pins zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zbus 5 depends on zvariant_derive; zbus 6 absorbed it, and the Linux client's tray (ksni) pins zbus 5" },
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-git = "deny"
unknown-registry = "deny"
